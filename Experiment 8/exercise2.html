<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Exercise 2 - Student Object</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f3;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 320px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input,
        button {
            width: 90%;
            margin: 10px;
            padding: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Student Info</h2>
        <input type="number" id="id" placeholder="ID">
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="dept" placeholder="Department">
        <input type="number" id="marks" placeholder="Marks">
        <button onclick="processStudent()">Submit</button>

        <p id="output"></p>
    </div>

    <script>
        function processStudent() {
            const student = {
                id: Number(document.getElementById("id").value),
                name: document.getElementById("name").value,
                department: document.getElementById("dept").value,
                marks: Number(document.getElementById("marks").value)
            };

            const { id, name, department, marks } = student;

            let grade;
            if (marks >= 90) grade = "A";
            else if (marks >= 75) grade = "B";
            else if (marks >= 50) grade = "C";
            else grade = "F";

            const updatedStudent = {
                ...student,
                grade
            };

            document.getElementById("output").innerHTML =
                `ID: ${id}, Name: ${name}, Dept: ${department}, Marks: ${marks} <br><br>
         Updated: ${JSON.stringify(updatedStudent)}`;
        }
    </script>

</body>

</html>
